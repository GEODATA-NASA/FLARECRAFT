<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeoFlare</title>
<link rel="icon" href="/flick.ico">
<link rel="stylesheet" href="/web/style.css">
<style>
  :root { --bg: #0b0b0d; --card: #16161a; --text: #f5f5f7; --sub: #a1a1a6; --accent: #ff7a2f; --line: rgba(255,255,255,.08); }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { background: var(--bg); min-height: 100%; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
  .lc-card { width: min(820px, 100%); text-align: center; }
  h1 { color: var(--text) !important; font-size: 44px; letter-spacing: -.02em; margin: 6px 0 0; } h1 span { color: var(--accent); }
  .lc-sub { color: var(--sub); margin: 4px 0 0; }
  .lc-flick-wrap { height: 200px; display: grid; place-items: center; margin-top: 10px; }
  .lc-flick-wrap svg { animation: bob 1.6s ease-in-out infinite; filter: drop-shadow(0 12px 30px rgba(255,122,47,.35)); }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(-2deg); } }
  .lc-bubble { display: inline-block; background: #fff; color: #1d1d1f; border-radius: 18px; padding: 12px 20px; font-weight: 600; margin-top: 4px; min-height: 24px; }
  .lc-steps { list-style: none; padding: 0; margin: 22px auto 0; width: min(420px, 100%); text-align: left; }
  .lc-steps li { display: flex; align-items: center; gap: 12px; padding: 8px 0; color: var(--sub); border-bottom: 1px solid var(--line); }
  .lc-steps li.lc-done { color: var(--text); }
  .lc-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #3a3a3c; flex: none; box-sizing: border-box; }
  li.lc-busy .lc-dot { border-color: var(--accent); border-top-color: transparent; animation: spin .8s linear infinite; }
  li.lc-done .lc-dot { border: 0; background: var(--accent); position: relative; }
  li.lc-done .lc-dot::after { content: ""; position: absolute; left: 6px; top: 3px; width: 4px; height: 8px; border: solid #1d1d1f; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .lc-choices { display: none; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 26px; }
  .lc-choices.lc-on { display: grid; animation: rise .5s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .lc-choice { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 22px 16px; color: var(--text); text-align: left; cursor: pointer; font: inherit; transition: transform .15s, border-color .15s; }
  .lc-choice:hover, .lc-choice:focus-visible { transform: translateY(-3px); border-color: var(--accent); outline: none; }
  .lc-choice b { display: block; font-size: 19px; } .lc-choice small { color: var(--sub); display: block; margin-top: 4px; }
  .lc-choice .lc-ic { font-size: 28px; }
  .lc-foot { margin-top: 22px; color: var(--sub); font-size: 13px; }
  .lc-foot button { background: none; border: 1px solid var(--line); color: var(--sub); border-radius: 999px; padding: 6px 14px; cursor: pointer; font: inherit; }
  .lc-foot button:hover { color: var(--text); border-color: var(--sub); }
  .lc-err { color: #c92a2a; }
  .lc-problems { text-align: left; width: min(620px, 100%); margin: 18px auto 0; padding-left: 20px; color: #ffb4b4; }
  .lc-problems li { margin: 8px 0; }
  .lc-warn { color: #ffd38a; font-size: 14px; max-width: 620px; margin: 14px auto 0; }
  @media (max-width: 640px) { .lc-choices.lc-on { grid-template-columns: 1fr; } h1 { font-size: 34px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style></head>
<body><main><div class="lc-card">
  <h1>Geo<span>Flare</span></h1>
  <p class="lc-sub">Team FLARECRAFT · NASA Space Apps 2026</p>
  <div class="lc-flick-wrap" id="flick"></div>
  <div class="lc-bubble" id="say" aria-live="polite">Hi! I'm Flick. Give me a moment to wake up the satellites…</div>
  <ul class="lc-steps" id="steps">
    <li id="s-geodata" class="lc-busy"><span class="lc-dot"></span>Loading the fire archive and the AI model</li>
    <li id="s-geoflare" class="lc-busy"><span class="lc-dot"></span>Loading the fire history since 2003</li>
    <li id="s-ready"><span class="lc-dot"></span>Ready</li>
  </ul>
  <div class="lc-choices" id="choices">
    <button class="lc-choice" data-url="http://127.0.0.1:8010/"><span class="lc-ic">🔥</span><b>GeoFlare</b><small>Flick's story, then the Fires and Air apps</small></button>
    <button class="lc-choice" data-url="http://127.0.0.1:8010/present/"><span class="lc-ic">🎬</span><b>The presentation</b><small>The guided story, with Flick's voice</small></button>
    <button class="lc-choice" data-url="http://127.0.0.1:8000/"><span class="lc-ic">🗺️</span><b>Severity map</b><small>Every 2026 and 2025 fire, scored by the model</small></button>
  </div>
  <p class="lc-foot" id="foot">This window can stay open as the menu. <button id="stop" type="button">Stop GeoFlare</button></p>
</div></main>
<script src="/web/flick.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  $("flick").innerHTML = Flick.svg(140, "happy");
  const lines = ["Hi! I'm Flick. Give me a moment to wake up the satellites…", "Counting 77 million fires… almost there!", "Lining up 23 years of history…"];
  let n = 0, ready = false;
  const nudge = setInterval(() => { if (!ready) $("say").textContent = lines[++n % lines.length]; }, 4000);
  async function poll() {
    try {
      const s = await (await fetch("/status", { cache: "no-store" })).json();
      for (const k of ["geodata", "geoflare"]) $("s-" + k).className = s[k] ? "lc-done" : "lc-busy";
      if (s.warnings && s.warnings.length && !$("warn")) $("steps").insertAdjacentHTML("afterend", `<p id="warn" class="lc-warn">${s.warnings.map(esc).join("<br>")}</p>`);
      if (s.failed) {
        clearInterval(nudge); $("flick").innerHTML = Flick.svg(140, "worried");
        $("say").innerHTML = `<span class="lc-err">I can't start GeoFlare yet. Here's what to fix:</span>`;
        $("steps").outerHTML = `<ul class="lc-problems">${(s.problems.length ? s.problems : ["Something went wrong while starting. The details are in the logs folder."]).map((p) => `<li>${esc(p)}</li>`).join("")}</ul>`;
        return;
      }
      if (s.geodata && s.geoflare) return done();
    } catch (e) { /* the launcher is starting */ }
    setTimeout(poll, 1000);
  }
  function done() {
    ready = true; clearInterval(nudge);
    $("s-ready").className = "lc-done";
    $("flick").innerHTML = Flick.svg(140, "wow");
    $("say").textContent = "All set! What do you want to open?";
    $("steps").style.display = "none";
    $("choices").classList.add("lc-on");
    document.querySelector(".lc-choice").focus();
  }
  document.querySelectorAll(".lc-choice").forEach((b) => b.addEventListener("click", () => window.open(b.dataset.url, "_blank")));
  $("stop").addEventListener("click", async () => {
    $("say").textContent = "Bye! Stopping GeoFlare…"; $("choices").classList.remove("lc-on");
    try { await fetch("/stop", { method: "POST" }); } catch (e) { /* already gone */ }
    $("foot").textContent = "GeoFlare has stopped. You can close this window.";
  });
  poll();
</script>
</body></html>
