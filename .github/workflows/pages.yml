# Publishes the judges' demo (demo/) and the rest of the repository on GitHub Pages:
# https://geodata-nasa.github.io/FLARECRAFT/demo/  (Settings -> Pages -> Source: GitHub Actions)
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Site files (the demo and the docs; no app data)
        run: |
          mkdir -p _site
          cp -r demo _site/demo
          cp README.md GEOFLARE_GUIDE.md _site/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=demo/"><title>GeoFlare</title><a href="demo/">GeoFlare demo</a>\n' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
