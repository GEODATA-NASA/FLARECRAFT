<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoFlare · the live story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 2c2 6 9 9 9 17a9 9 0 0 1-18 0c0-5 3-7 5-11 1 3 2 4 3 4-1-4-1-7 1-10z' fill='%23e8590c'/></svg>">
  <link rel="stylesheet" href="/style.css">   <!-- Flick's expressions live in the app's stylesheet -->
  <link rel="stylesheet" href="/present/present.css">
</head>
<body class="present">
<div id="stage">
  <div id="scene"></div>
  <div id="spot"></div>
  <canvas id="fx" width="1600" height="1000"></canvas>
  <div id="flick"></div>
  <div id="badge"></div>
  <div id="bubble"><b>Flick</b><span></span></div>
  <div id="hud">
    <div id="hud-label"><b></b><span></span></div>
    <div id="hud-who"></div>
    <div id="hud-dots"></div>
  </div>
  <button id="dim" class="corner" type="button" aria-pressed="true" aria-label="Highlight and darkening" title="Highlight and darkening are on (L)">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="5" y="7" width="14" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path class="on" d="M12 1.5v3M12 19.5v3M1.5 12h2M20.5 12h2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="off" d="M4 20L20 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <button id="voice" class="corner" type="button" aria-pressed="true" aria-label="Flick's voice" title="Flick's voice is on (M)">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="on" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="off" d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div id="black"></div>
  <div id="help">Space or → next · ← back · 1–9 jump · N script · M voice · L highlight · B black · D dashboard · F full screen · C calm</div>
</div>
<script src="/vendor/d3.min.js"></script>
<script src="/vendor/topojson-client.min.js"></script>
<script src="/vendor/anime.min.js"></script>
<script src="/flick.js"></script>
<script src="/present/script.js"></script>
<script src="/present/engine.js"></script>
<script src="/present/scenes.js"></script>
</body>
</html>
